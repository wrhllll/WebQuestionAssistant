<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>网页题目助手</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <main>
      <header class="heading">
        <h1>网页题目助手</h1>
        <button id="open-settings" class="text-button" type="button">设置</button>
      </header>
      <div id="popup-detailed-panel" class="popup-detailed-panel" hidden>
        <div class="popup-segmented" role="radiogroup" aria-label="默认工作模式">
          <label class="popup-segment">
            <input type="radio" name="popup-mode" value="local">
            <span>本地框选导出</span>
          </label>
          <label class="popup-segment">
            <input type="radio" name="popup-mode" value="ai">
            <span>AI 视觉解答</span>
          </label>
        </div>
        <div id="popup-local-bar" class="popup-local-bar" hidden>
          <label class="popup-inline-opt">
            <input id="popup-auto-download" type="checkbox" checked>
            <span>直接下载</span>
          </label>
          <span class="popup-bar-sep" aria-hidden="true">·</span>
          <label class="popup-inline-opt">
            <input id="popup-format-png" type="checkbox" value="png" checked>
            <span>PNG</span>
          </label>
          <label class="popup-inline-opt">
            <input id="popup-format-pdf" type="checkbox" value="pdf">
            <span>PDF</span>
          </label>
        </div>
        <div id="popup-ai-bar" class="popup-ai-bar" hidden>
          <p id="popup-active-profile" class="active-profile-hint"></p>
          <label class="popup-instruction-label" for="popup-instruction">补充说明（可选）</label>
          <textarea id="popup-instruction" class="popup-instruction" rows="2" placeholder="例如：请重点解答第 2 题，步骤简洁。"></textarea>
        </div>
      </div>
      <button id="capture-page" class="primary-button capture-primary" type="button">截取网页长图</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <a id="open-editor-link" class="popup-editor-link" href="#" hidden>需要微调？打开编辑页</a>
    </main>
    <script src="result-store.js"></script>
    <script src="api-profiles.js"></script>
    <script src="exporter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
